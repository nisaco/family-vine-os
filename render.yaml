services:
  - type: web
    name: family-vine-choir
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /setup
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: family_vine
      - key: SESSION_SECRET
        generateValue: true
    # Keep this disk until the existing SQLite database has been migrated and verified.
    disk:
      name: choir-data
      mountPath: /var/data
      sizeGB: 1
